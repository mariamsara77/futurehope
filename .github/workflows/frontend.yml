name: Frontend CI

on:
  push:
    branches:
      - feat/foundation-platform-v2
  pull_request:
    branches:
      - main
      - feat/foundation-platform-v2

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
